name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://ann-ai-lac.vercel.app
          note() { echo "::notice title=$1::$(echo "$2" | tr -d '\r\n%' | cut -c1-300)"; }
          note "home headers" "$(curl -s -o /dev/null -D - $B/ | grep -iE '^HTTP|content-security|x-frame|x-content-type|referrer-policy|permissions-policy|strict-transport' | cut -c1-60 | tr '\n' ' ')"
          note "api headers" "$(curl -s -o /dev/null -D - $B/api/v1/settings | grep -iE '^HTTP|x-frame|x-content-type|cache-control' | tr '\n' ' ')"
          note "settings" "$(curl -s $B/api/v1/settings | head -c 120)"
          note "POST account json" "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' $B/api/v1/account)"
          note "POST order text/plain" "$(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: text/plain' -d '{"type":"pickup"}' $B/api/v1/order)"
          note "push to evil host" "$(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: application/json' -d '{"sub":{"endpoint":"https://169.254.169.254/x"}}' $B/api/v1/push/subscribe)"
          note "admin no pin" "$(curl -s -o /dev/null -w '%{http_code}' $B/api/v1/admin/orders)"
          note "knowledge no pin" "$(curl -s -o /dev/null -w '%{http_code}' $B/api/knowledge)"
          note "source files" "$(for p in /server.js /lib/accounts.js /data/shop.json /.git/config /api/gateway.js; do printf '%s=%s ' $p $(curl -s -o /dev/null -w '%{http_code}' $B$p); done)"
          note "pages" "$(for p in / /account /gift /orders /order /wallet; do printf '%s=%s ' $p $(curl -s -o /dev/null -w '%{http_code}' $B$p); done)"
