name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "/api/app?diag=1" "/api/v1/settings" "/api/pass?check=1" "/api/app" "/account"; do
            h=$(curl -s -o /tmp/b -D - "https://ann-ai-lac.vercel.app$u" | grep -iE "^HTTP|x-vercel-error|x-matched-path|content-type" | tr -d '\r' | tr '\n' ' ')
            b=$(head -c 200 /tmp/b | tr -d '\r\n%')
            echo "::notice title=$u::$h || $b"
          done
