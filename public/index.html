<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b1f10">
<meta name="description" content="آن coffee — قهوة مختصة وأكثر. قريبًا في شمال محايل عسير.">
<title>آن coffee — قريبًا الافتتاح</title>
<link rel="preload" href="/concept-desktop.webp" as="image" type="image/webp">
<link rel="preload" href="/concept-mobile.webp" as="image" type="image/webp" media="(max-width:700px)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="concept-stage" aria-label="آن coffee">
  <picture class="concept-picture">
    <source media="(max-width:700px)" srcset="/concept-mobile.webp">
    <img class="concept-art" src="/concept-desktop.webp" alt="آن coffee — لحظتك تبدأ من آن">
  </picture>
  <button class="chat-fab" type="button" data-open-chat aria-label="اسأل آن">
    <span class="fab-status" aria-hidden="true"></span>
    <span class="bot-icon">☕</span>
    <strong>اسأل آن</strong>
    <span class="arrow">‹</span>
  </button>
</main>

<div class="chat-backdrop" data-close-chat hidden></div>
<aside class="chat-panel" id="chatPanel" aria-hidden="true" aria-label="مساعد آن الذكي">
  <div class="chat-panel-head">
    <div class="assistant-avatar">آن</div>
    <div class="assistant-meta">
      <strong>مساعد آن الذكي</strong>
      <span><i aria-hidden="true"></i> متصل الآن</span>
    </div>
    <button class="close-chat" type="button" data-close-chat aria-label="إغلاق">×</button>
  </div>
  <div class="chat-intro"><span>آن AI</span><h2>وش ودّك تعرف؟</h2><p>أجاوبك بالمعلومات المؤكدة عن آن coffee.</p></div>
  <div id="messages" class="messages" aria-live="polite">
    <div class="msg bot"><div class="bubble">ياهلا 🤎 أنا مساعد آن coffee. اسألني عن الافتتاح أو الموقع.</div></div>
  </div>
  <div class="quick"><button type="button">متى الافتتاح؟</button><button type="button">وين موقعكم؟</button><button type="button">وش تقدمون؟</button></div>
  <form id="form" class="composer"><input id="input" autocomplete="off" maxlength="1000" placeholder="اكتب سؤالك هنا..." aria-label="اكتب سؤالك"><button type="submit" aria-label="إرسال">➤</button></form>
  <div class="chat-note">آن coffee · قهوة مختصة وأكثر</div>
</aside>
<script src="/app.js"></script>
</body>
</html>
