<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4A241C">
<title>آن coffee — قريبًا الافتتاح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="cover">
  <div class="shade"></div>

  <a class="admin-link" href="/admin" aria-label="الإدارة">الإدارة</a>

  <section class="brand-card">
    <img class="logo" src="/logo.webp" alt="آن coffee">
    <p class="tagline">قهوة مختصة وأكثر</p>
    <div class="location">📍 شمال محايل عسير</div>
    <div class="opening">قريبًا الافتتاح</div>
  </section>

  <section class="assistant-card">
    <div class="assistant-head">
      <div class="avatar">آن</div>
      <div>
        <strong>مساعد آن الذكي</strong>
        <span><i></i> متصل الآن</span>
      </div>
    </div>

    <div id="messages" class="messages">
      <div class="msg bot">
        <div class="bubble">ياهلا 🤎 أنا مساعد آن coffee. اسألني عن الافتتاح أو الموقع.</div>
      </div>
    </div>

    <div class="quick">
      <button type="button">متى الافتتاح؟</button>
      <button type="button">وين موقعكم؟</button>
    </div>

    <form id="form" class="composer">
      <input id="input" autocomplete="off" maxlength="1000" placeholder="اكتب سؤالك..." aria-label="رسالتك">
      <button type="submit" aria-label="إرسال">↑</button>
    </form>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
